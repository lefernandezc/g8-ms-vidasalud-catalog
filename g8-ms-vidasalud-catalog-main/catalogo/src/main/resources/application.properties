spring.application.name=catalogo
server.port=8082

# Conexión Base de Datos Oracle
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XE
spring.datasource.username=system
spring.datasource.password=oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración JPA / Hibernate para Oracle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Configuración de conexión a RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Fundamental para la rúbrica: Activar ACK/NACK manual
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Configuración centralizada de nombres Evita hardcodear en Java
messaging.exchange.catalogo=catalogo.exchange
messaging.queue.catalogo=catalogo.queue
messaging.routing-key.catalogo=catalogo.routing